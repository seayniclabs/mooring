name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[test]"
          pip install pip-audit

      - name: Run tests
        run: pytest -v --cov=mooring --cov-report=xml --cov-fail-under=90

      - name: Security audit
        run: pip-audit

      - name: Leakage scan
        run: |
          ! grep -ri "charlieseay\|seaynicroute\|192\.168\.0" src/ || (echo "LEAK DETECTED" && exit 1)

      - name: Token exposure scan
        run: |
          ! grep -ri "ghp_\|gho_\|github_pat_" src/ || (echo "TOKEN PATTERN DETECTED" && exit 1)
